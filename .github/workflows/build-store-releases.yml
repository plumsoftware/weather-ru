name: Build store release packages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout merged master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid reinstalling it with setup-android, which failed before the build.
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi
          echo "Using Android SDK at $SDK_ROOT"
          ls -la "$SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing"
              exit 1
            fi
          done
          test -f app/weatherforecast_keysafe_jetpack_compose.jks

      - name: Build APK and AAB for all stores
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:assembleRustoreRelease :app:bundleRustoreRelease \
            :app:assembleHuaweiRelease :app:bundleHuaweiRelease \
            :app:assembleGooglePlayRelease :app:bundleGooglePlayRelease

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-ru-release-packages-${{ github.run_number }}
          path: |
            app/build/outputs/apk/rustore/release/*.apk
            app/build/outputs/apk/huawei/release/*.apk
            app/build/outputs/apk/googlePlay/release/*.apk
            app/build/outputs/bundle/rustoreRelease/*.aab
            app/build/outputs/bundle/huaweiRelease/*.aab
            app/build/outputs/bundle/googlePlayRelease/*.aab
          if-no-files-found: error
          retention-days: 14
