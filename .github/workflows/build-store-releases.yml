name: Build store release packages

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout merged master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing and API secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD OWM_API_KEY WEATHER_API; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing"
              exit 1
            fi
          done
          test -f app/weatherforecast_keysafe_jetpack_compose.jks

      - name: Build APK and AAB for all stores
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :app:assembleRustoreRelease :app:bundleRustoreRelease \
            :app:assembleHuaweiRelease :app:bundleHuaweiRelease \
            :app:assembleGooglePlayRelease :app:bundleGooglePlayRelease

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-ru-release-packages-${{ github.run_number }}
          path: |
            app/build/outputs/apk/rustore/release/*.apk
            app/build/outputs/apk/huawei/release/*.apk
            app/build/outputs/apk/googlePlay/release/*.apk
            app/build/outputs/bundle/rustoreRelease/*.aab
            app/build/outputs/bundle/huaweiRelease/*.aab
            app/build/outputs/bundle/googlePlayRelease/*.aab
          if-no-files-found: error
          retention-days: 14
